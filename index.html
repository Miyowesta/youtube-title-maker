<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTubeタイトル・説明文メーカー</title>
<meta name="description" content="動画の内容を書くだけで、AIがタイトル案・説明文・ハッシュタグを考えてくれます。">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #2b2a28;
    --sub: #6f6b64;
    --line: #e4e0d8;
    --accent: #d9443a;
    --accent-soft: #fbe9e7;
    --ok: #2f8a57;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 64px; }
  header { text-align: center; margin-bottom: 20px; }
  header .logo {
    display: inline-flex; align-items: center; justify-content: center;
    width: 52px; height: 36px; border-radius: 10px; background: var(--accent);
    margin-bottom: 8px;
  }
  header .logo::after {
    content: ""; border-left: 14px solid #fff;
    border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 4px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  header p { margin: 0; color: var(--sub); font-size: .92rem; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; margin-bottom: 16px;
  }
  .ttl { display: block; font-weight: 700; margin-bottom: 6px; }
  .hint { font-size: .82rem; color: var(--sub); margin: 0 0 8px; }
  textarea, input[type=text] {
    width: 100%; font: inherit; color: inherit; background: #fff;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 130px; resize: vertical; }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .count { text-align: right; font-size: .8rem; color: var(--sub); margin-top: 4px; }
  .count.over { color: var(--accent); font-weight: 700; }
  .field + .field { margin-top: 18px; }

  .tones { display: flex; flex-wrap: wrap; gap: 8px; }
  .tones button {
    font: inherit; font-size: .9rem; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--text);
  }
  .tones button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .go {
    display: block; width: 100%; margin-top: 20px; padding: 14px; font: inherit; font-weight: 700;
    font-size: 1.05rem; color: #fff; background: var(--accent); border: none; border-radius: 12px; cursor: pointer;
  }
  .go:disabled { opacity: .55; cursor: default; }

  .status { text-align: center; color: var(--sub); margin: 18px 0; min-height: 1.7em; }
  .status.err { color: var(--accent); }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "・"; } 50% { content: "・・"; } 75% { content: "・・・"; } }

  #result { display: none; }
  #result h2 { font-size: 1.05rem; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .titles { list-style: none; padding: 0; margin: 0; }
  .titles li {
    display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line);
  }
  .titles li:first-child { border-top: none; padding-top: 0; }
  .titles .t { flex: 1; font-weight: 600; }
  .titles .n { display: block; font-size: .75rem; color: var(--sub); font-weight: 400; }
  .copy {
    flex: none; font: inherit; font-size: .8rem; padding: 4px 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--text); white-space: nowrap;
  }
  .copy.done { color: var(--ok); border-color: var(--ok); }
  .desc { white-space: pre-wrap; margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tags span { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 10px; font-size: .88rem; }
  .again { text-align: center; }
  .again button {
    font: inherit; padding: 8px 18px; border-radius: 10px; cursor: pointer;
    background: #fff; border: 1px solid var(--line); color: var(--text);
  }
  footer { text-align: center; font-size: .78rem; color: var(--sub); margin-top: 28px; }
  footer a { color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"></div>
    <h1>YouTubeタイトル・説明文メーカー</h1>
    <p>動画の内容を書くだけで、AIがタイトル案と説明文を考えます</p>
  </header>

  <form class="card" id="form">
    <div class="field">
      <label class="ttl" for="content">どんな動画ですか？</label>
      <p class="hint">内容・見どころ・だれに見てほしいかなどを、ふつうの文章で書いてください。</p>
      <textarea id="content" maxlength="600" placeholder="例）雨の音と遠くの雷の音を3時間流す動画。広告なしで、途中で暗くなる。寝る前や勉強中に聞いてほしい。"></textarea>
      <div class="count" id="count">0 / 600</div>
    </div>

    <div class="field">
      <label class="ttl" for="channel">チャンネルのジャンル <span class="hint">（なくてもOK）</span></label>
      <input type="text" id="channel" maxlength="60" placeholder="例）睡眠用BGM、料理、ゲーム実況">
    </div>

    <div class="field">
      <span class="ttl">雰囲気</span>
      <div class="tones" id="tones" role="group" aria-label="雰囲気"></div>
    </div>

    <button type="submit" class="go" id="go">AIに考えてもらう</button>
  </form>

  <div class="status" id="status" role="status"></div>

  <section id="result">
    <div class="card">
      <h2>タイトル案</h2>
      <ul class="titles" id="titles"></ul>
    </div>
    <div class="card">
      <h2>説明文 <button class="copy" data-target="desc">コピー</button></h2>
      <p class="desc" id="desc"></p>
    </div>
    <div class="card">
      <h2>ハッシュタグ <button class="copy" data-target="tags">まとめてコピー</button></h2>
      <div class="tags" id="tags"></div>
    </div>
    <div class="again"><button id="again">内容を変えて作り直す</button></div>
  </section>

  <footer>
    AIが考えた案です。投稿する前に内容を確かめてください。<br>
    作った人：みよえすた ・ <a href="https://note.com/miyowesta" target="_blank" rel="noopener">note</a>
  </footer>
</div>

<script>
// 中継サーバーのURL（1本目と同じサーバーの /title という窓口を使います）
const API_URL = "https://animal-shindan-api.miyowesta.workers.dev/title";

const TONES = ["おまかせ", "やさしく落ち着いた", "元気で楽しい", "まじめで分かりやすい", "ワクワクする"];
let tone = TONES[0];

const $ = id => document.getElementById(id);
const content = $("content"), count = $("count"), go = $("go"), status = $("status");

// 雰囲気のボタンを並べる
TONES.forEach(t => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = t;
  b.setAttribute("aria-pressed", t === tone);
  b.onclick = () => {
    tone = t;
    document.querySelectorAll("#tones button").forEach(x => x.setAttribute("aria-pressed", x === b));
  };
  $("tones").appendChild(b);
});

// 文字数を数える
content.addEventListener("input", () => {
  const n = content.value.length;
  count.textContent = `${n} / 600`;
  count.classList.toggle("over", n >= 600);
});

// コピーボタン
async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  const old = btn.textContent;
  btn.textContent = "コピーしました";
  btn.classList.add("done");
  setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1500);
}
document.querySelectorAll("#result h2 .copy").forEach(btn => {
  btn.onclick = () => {
    const text = btn.dataset.target === "desc"
      ? $("desc").textContent
      : [...$("tags").children].map(s => s.textContent).join(" ");
    copyText(text, btn);
  };
});

// 結果を表示する
function show(data) {
  const ul = $("titles");
  ul.innerHTML = "";
  data.titles.forEach(t => {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.className = "t";
    span.textContent = t;
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = `${t.length}文字`;
    span.appendChild(n);
    const btn = document.createElement("button");
    btn.className = "copy";
    btn.textContent = "コピー";
    btn.onclick = () => copyText(t, btn);
    li.append(span, btn);
    ul.appendChild(li);
  });
  $("desc").textContent = data.description;
  const tags = $("tags");
  tags.innerHTML = "";
  data.hashtags.forEach(h => {
    const s = document.createElement("span");
    s.textContent = h.startsWith("#") ? h : "#" + h;
    tags.appendChild(s);
  });
  $("result").style.display = "block";
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

// 「AIに考えてもらう」を押したとき
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = content.value.trim();
  if (text.length < 5) {
    status.className = "status err";
    status.textContent = "動画の内容をもう少しくわしく書いてください。";
    content.focus();
    return;
  }
  go.disabled = true;
  status.className = "status";
  status.innerHTML = '<span class="dots">AIが考えています</span>';

  try {
    const body = { content: text, tone };
    const channel = $("channel").value.trim();
    if (channel) body.channel = channel;
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok || !Array.isArray(data.titles)) throw new Error(data.error || "error");
    status.textContent = "";
    show(data);
  } catch (err) {
    status.className = "status err";
    status.textContent = "うまく作れませんでした。少し時間をおいて、もう一度お試しください。";
  } finally {
    go.disabled = false;
  }
});

$("again").onclick = () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
  content.focus();
};
</script>
</body>
</html>
